<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>NOW — thanh menu</title>

<!-- Trang này chỉ sống trong popover của app trên thanh menu, rộng 360pt. Nó KHÔNG
     phải một màn thứ tám của dashboard: không nav, không router, không SSE. Mở là
     đọc một lượt rồi đóng.

     Không có <link rel=manifest> và không có font Google ở đây. Popover phải hiện
     trong vài chục mili giây, mà font ngoài mạng thì lúc máy mất mạng treo tới khi
     DNS bỏ cuộc — trên một cửa sổ bật ra rồi tắt ngay, cái giá đó không đáng. Chữ số
     rơi về SF Mono của hệ thống, cùng họ với chính thanh menu ở trên. -->
<link rel="stylesheet" href="/styles.css">

<!-- Nền đặt TRƯỚC nhịp vẽ đầu, như index.html — nếu không thì mỗi lần mở popover là một
     nháy trắng dưới một thanh menu tối.

     Mặc định vẫn là APPEARANCE CỦA MACOS, và đó là chỗ khác index.html: WKWebView trong
     app Swift có kho localStorage riêng, không dùng chung với Safari, nên cái theme người
     dùng chọn trên dashboard không với tới đây được.

     Từ lượt 18 cửa sổ này có công tắc riêng — bấm vào mặt trời, xem `lib/mbtheme.js`. Kho
     riêng ở đây là kho CỦA NÓ, nên đọc được. Ba chế độ: `auto` hỏi macOS, hai chế độ kia
     trả chính nó.

     Đoạn dưới đây là BẢN CHÉP DUY NHẤT của `resolveTheme` bên module ấy, và nó được phép
     tồn tại vì nó phải chạy ĐỒNG BỘ trước nhịp vẽ đầu — module thì `defer`. Khoá phải khớp
     'now-mb-theme'; đổi tên ở một bên mà quên bên kia thì cái hỏng là một nháy trắng, không
     phải một dòng lỗi. -->
<script>
  var dark = matchMedia('(prefers-color-scheme: dark)');
  var m;
  try { m = localStorage.getItem('now-mb-theme'); } catch (e) { m = null; }
  if (m !== 'light' && m !== 'dark') m = dark.matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', m);
</script>
</head>
<body class="mb-body">
<div id="mb">
  <div class="mb-wait">đang đọc…</div>
</div>
<script type="module" src="/menubar.js"></script>
</body>
</html>
