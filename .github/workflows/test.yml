name: test

# The dashboard's own suite. Mirror image of plugin-validate.yml: that one runs only
# when the plugin moves, this one runs only when the dashboard does. Between the two
# filters every push gets exactly the checks that can say something about it.
#
# `paths-ignore` fires the job unless EVERY changed file is under one of these — so a
# commit touching `docs/` alone stays quiet, but `docs/` plus one line of `src/` runs.
# Caveat if this ever becomes a required check: a PR that only edits `plugin/` or
# `docs/` never starts this workflow, and a required-but-never-started check blocks
# merge forever. Mark it required only together with a merge-queue/skip rule.
on:
  push:
    branches: [main]
    paths-ignore:
      - "plugin/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "plugin/**"
      - "docs/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # One red version should not hide the others — when a Node upgrade breaks
      # something, the useful information is WHICH versions break, not just "some did".
      fail-fast: false
      matrix:
        # 18.10.0 is the exact floor the README badge and package.json `engines` claim,
        # so it is pinned rather than ranged: `18.x` would quietly drift off the number
        # actually being promised. The rest are the LTS lines plus current.
        node: ["18.10.0", "20", "22", "24"]

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No `cache: npm` on purpose — it needs a lockfile, and this repo has none
          # because it has no dependencies. Asking for the cache fails the step outright.

      # No install step: package.json declares zero dependencies and there is no
      # lockfile, so `npm ci` would only fail and `npm install` would only be a no-op
      # round-trip to the registry. `node:test` ships with Node itself.
      - name: npm test
        run: npm test

  # GitHub runners are UTC, so the matrix above can only ever prove the suite passes at
  # offset 0. A date test that slices the first ten characters off an ISO string is right
  # at UTC and wrong everywhere else, and this job exists because that happened: the suite
  # was red across the whole of the Americas and Europe while CI stayed green, and the
  # breakage was found by hand rather than by a check. The repo is public, so a clone in
  # Los Angeles has to be able to run `npm test`.
  #
  # A second required check only helps if it is required. When `test` is marked required,
  # mark this one at the same time. A regression that only shows up off UTC passes `test`
  # green, which is exactly how the last one shipped.
  #
  # One Node version is enough here on purpose. Timezone handling lives in the ICU data
  # and the `Date` getters, neither of which differs across the matrix, so repeating all
  # four versions per zone would quadruple the runtime to re-prove the same thing. Adding
  # a zone is the cheaper thing to do, and the bar for adding one is that the whole suite
  # has been run there by hand first, since a zone that goes red on arrival teaches people
  # to ignore the job rather than to fix the bug.
  #
  # All three below cleared that bar on 2026-09-10 at 635/635, together with UTC,
  # Europe/Berlin and Asia/Ho_Chi_Minh, which are covered by the offsets already listed.
  test-tz:
    runs-on: ubuntu-latest

    strategy:
      # Same reasoning as the matrix above: one red zone must not hide the others.
      fail-fast: false
      matrix:
        # Three shapes of wrongness, not three zones. Los Angeles is west of UTC, so any
        # "local day equals the UTC day" assumption is off by one for most of the day.
        # Kiritimati is the far east mirror at UTC+14, which breaks the same assumption in
        # the opposite direction and is the only zone that can be a full day ahead of UTC.
        # Chatham is UTC+12:45, so it also catches anything that assumes offsets land on a
        # whole hour.
        tz: ["America/Los_Angeles", "Pacific/Kiritimati", "Pacific/Chatham"]

    name: node 22 · TZ ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm test
        run: npm test
        env:
          TZ: ${{ matrix.tz }}
